<svg viewBox="0 0 400 600" xmlns="http://www.w3.org/2000/svg" className="w-full h-auto">
  <!-- Background -->
  <rect width="400" height="600" fill="#f5f5f5"/>
  
  <!-- Decorative hills/landscape -->
  <path d="M 0 300 Q 100 250 200 280 T 400 300 L 400 600 L 0 600 Z" fill="#e8f5e9" opacity="0.3"/>
  
  <!-- Trees scattered -->
  <g opacity="0.15">
    <circle cx="50" cy="350" r="8" fill="#2d5016"/>
    <circle cx="120" cy="380" r="8" fill="#2d5016"/>
    <circle cx="280" cy="400" r="8" fill="#2d5016"/>
    <circle cx="350" cy="340" r="8" fill="#2d5016"/>
    <circle cx="80" cy="450" r="8" fill="#2d5016"/>
    <circle cx="320" cy="480" r="8" fill="#2d5016"/>
  </g>

  <!-- Delivery radius circle (pink) -->
  <circle cx="200" cy="280" r="140" fill="none" stroke="#ff4081" stroke-width="8" opacity="0.6" stroke-dasharray="5,5"/>
  <text x="200" y="160" text-anchor="middle" font-size="12" font-weight="bold" fill="#ff4081" opacity="0.7">DELIVERY RADIUS</text>

  <!-- Newcastle marker and label -->
  <circle cx="200" cy="280" r="12" fill="#1a1a1a" stroke="#ffeb3b" stroke-width="3"/>
  <text x="200" y="320" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a1a1a">NEWCASTLE</text>
  <circle cx="200" cy="280" r="3" fill="#ffeb3b"/>

  <!-- Sunderland marker and label -->
  <circle cx="230" cy="340" r="10" fill="#666" stroke="#ffeb3b" stroke-width="2"/>
  <text x="230" y="375" text-anchor="middle" font-size="13" font-weight="600" fill="#1a1a1a">Sunderland</text>

  <!-- Durham marker and label -->
  <circle cx="160" cy="380" r="10" fill="#666" stroke="#ffeb3b" stroke-width="2"/>
  <text x="160" y="415" text-anchor="middle" font-size="13" font-weight="600" fill="#1a1a1a">Durham</text>

  <!-- Gateshead marker and label -->
  <circle cx="170" cy="290" r="8" fill="#999" stroke="#ffeb3b" stroke-width="1.5"/>
  <text x="170" y="310" text-anchor="middle" font-size="11" font-weight="500" fill="#666">Gateshead</text>

  <!-- Key neighborhoods -->
  <text x="240" y="240" font-size="10" font-weight="500" fill="#666" opacity="0.8">Jesmond</text>
  <text x="140" y="250" font-size="10" font-weight="500" fill="#666" opacity="0.8">Heaton</text>
  <text x="260" y="290" font-size="10" font-weight="500" fill="#666" opacity="0.8">Gosforth</text>
  <text x="100" y="320" font-size="10" font-weight="500" fill="#666" opacity="0.8">West End</text>

  <!-- Legend -->
  <g>
    <rect x="20" y="520" width="360" height="60" fill="white" stroke="#ccc" stroke-width="1" rx="4"/>
    <circle cx="35" cy="540" r="6" fill="#1a1a1a" stroke="#ffeb3b" stroke-width="2"/>
    <text x="50" y="545" font-size="12" font-weight="600" fill="#1a1a1a">Main Hub</text>
    
    <circle cx="35" cy="565" r="5" fill="#666" stroke="#ffeb3b" stroke-width="1.5"/>
    <text x="50" y="570" font-size="12" font-weight="600" fill="#666">Service Areas</text>
    
    <line x1="200" y1="555" x2="220" y2="555" stroke="#ff4081" stroke-width="2" stroke-dasharray="2,2" opacity="0.6"/>
    <text x="230" y="560" font-size="12" font-weight="600" fill="#ff4081">Delivery Radius</text>
  </g>
</svg>
