<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg" className="w-full h-auto">
  <defs>
    <!-- Gradient backgrounds -->
    <linearGradient id="mapGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0f4f9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e8ecf1;stop-opacity:1" />
    </linearGradient>
    
    <!-- Shadow filters -->
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.2"/>
    </filter>
    
    <filter id="shadowLarge" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Map background -->
  <rect width="400" height="400" fill="url(#mapGradient)"/>
  
  <!-- Subtle grid lines -->
  <g stroke="#d0d7de" stroke-width="0.5" opacity="0.3">
    <line x1="0" y1="100" x2="400" y2="100"/>
    <line x1="0" y1="200" x2="400" y2="200"/>
    <line x1="0" y1="300" x2="400" y2="300"/>
    <line x1="100" y1="0" x2="100" y2="400"/>
    <line x1="200" y1="0" x2="200" y2="400"/>
    <line x1="300" y1="0" x2="300" y2="400"/>
  </g>

  <!-- Delivery radius circle -->
  <circle cx="200" cy="180" r="110" fill="none" stroke="#ff4081" stroke-width="3" opacity="0.15"/>
  <circle cx="200" cy="180" r="110" fill="none" stroke="#ff4081" stroke-width="2" stroke-dasharray="8,4" opacity="0.4"/>

  <!-- Decorative location clusters (smaller service points) -->
  <g opacity="0.4">
    <circle cx="310" cy="250" r="3" fill="#90a4ae"/>
    <circle cx="90" cy="280" r="3" fill="#90a4ae"/>
    <circle cx="320" cy="150" r="3" fill="#90a4ae"/>
    <circle cx="80" cy="160" r="3" fill="#90a4ae"/>
  </g>

  <!-- Service areas (Sunderland) -->
  <g filter="url(#shadow)">
    <circle cx="230" cy="230" r="14" fill="#ffd54f" stroke="#fff" stroke-width="2"/>
    <circle cx="230" cy="230" r="10" fill="#ffb300" opacity="0.8"/>
  </g>

  <!-- Service areas (Durham) -->
  <g filter="url(#shadow)">
    <circle cx="150" cy="270" r="14" fill="#ffb74d" stroke="#fff" stroke-width="2"/>
    <circle cx="150" cy="270" r="10" fill="#ff9800" opacity="0.8"/>
  </g>

  <!-- Gateshead marker -->
  <g filter="url(#shadow)">
    <circle cx="160" cy="170" r="12" fill="#90caf9" stroke="#fff" stroke-width="2"/>
    <circle cx="160" cy="170" r="8" fill="#42a5f5" opacity="0.8"/>
  </g>

  <!-- Main hub (Newcastle) - prominent pin -->
  <g filter="url(#shadowLarge)">
    <circle cx="200" cy="180" r="18" fill="#ffeb3b" stroke="#fff" stroke-width="3"/>
    <circle cx="200" cy="180" r="13" fill="#fbc02d"/>
    <circle cx="200" cy="180" r="6" fill="#f57f17"/>
  </g>

  <!-- Location labels with better typography -->
  <text x="200" y="168" text-anchor="middle" font-size="8" font-weight="700" fill="#1a1a1a" letter-spacing="0.4">NEWCASTLE</text>
  
  <text x="230" y="248" text-anchor="middle" font-size="10" font-weight="600" fill="#1a1a1a">Sunderland</text>
  <text x="150" y="288" text-anchor="middle" font-size="10" font-weight="600" fill="#1a1a1a">Durham</text>
  <text x="160" y="186" text-anchor="middle" font-size="8" font-weight="500" fill="#555">Gateshead</text>

  <!-- Neighborhood labels (lighter) -->
  <text x="250" y="140" text-anchor="middle" font-size="7" font-weight="400" fill="#999" opacity="0.7">Jesmond</text>
  <text x="120" y="140" text-anchor="middle" font-size="7" font-weight="400" fill="#999" opacity="0.7">Heaton</text>
  <text x="280" y="185" text-anchor="middle" font-size="7" font-weight="400" fill="#999" opacity="0.7">Gosforth</text>
  <text x="90" y="210" text-anchor="middle" font-size="7" font-weight="400" fill="#999" opacity="0.7">West End</text>

  <!-- Radius label -->
  <text x="200" y="95" text-anchor="middle" font-size="9" font-weight="600" fill="#ff4081" opacity="0.6" letter-spacing="0.3">DELIVERY RADIUS</text>

  <!-- Legend box -->
  <g>
    <!-- Background -->
    <rect x="12" y="330" width="376" height="58" fill="white" stroke="#d0d7de" stroke-width="1.5" rx="6" opacity="0.95"/>
    
    <!-- Legend items -->
    <g>
      <!-- Main Hub -->
      <circle cx="30" cy="345" r="6" fill="#ffeb3b" stroke="#fff" stroke-width="1.5"/>
      <circle cx="30" cy="345" r="3" fill="#f57f17"/>
      <text x="42" y="349" font-size="11" font-weight="600" fill="#1a1a1a">Main Hub</text>
      
      <!-- Service Areas -->
      <circle cx="30" cy="365" r="6" fill="#ffb300" stroke="#fff" stroke-width="1.5"/>
      <text x="42" y="369" font-size="11" font-weight="600" fill="#1a1a1a">Service Areas</text>
      
      <!-- Delivery Radius -->
      <line x1="30" y1="378" x2="40" y2="378" stroke="#ff4081" stroke-width="2" stroke-dasharray="3,2" opacity="0.6"/>
      <text x="42" y="382" font-size="11" font-weight="600" fill="#ff4081" opacity="0.8">Delivery Radius</text>
    </g>
  </g>

  <!-- Subtle corner accents -->
  <circle cx="15" cy="15" r="1.5" fill="#ff4081" opacity="0.1"/>
  <circle cx="385" cy="385" r="1.5" fill="#ff4081" opacity="0.1"/>
</svg>
